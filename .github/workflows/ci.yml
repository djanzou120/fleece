name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  # -----------------------------------------------------------------------
  # Go: build, vet, test
  # -----------------------------------------------------------------------
  go:
    name: Go build / vet / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true

      - name: Build all Go services
        run: go build ./src/...

      - name: Vet all Go sources
        run: go vet ./src/...

      - name: Test all Go sources
        run: go test ./src/...

      - name: Install make
        run: sudo apt-get install -y make

      # D-M09 / M-024: `go build ./src/...` above only proves every package
      # COMPILES — it does not prove `make build pkg=<x>` (what CI/CD and
      # docker/go.dockerfile actually invoke) produces a real executable.
      # src/api, src/core-processor and src/intelligence-processor each place
      # their composition root in a src/<pkg>/cmd/<pkg> subdirectory (Go
      # requires one package per directory), while src/<pkg> itself is an
      # importable library package ("package api"/"package coreprocessor"/
      # "package intelligenceprocessor") — `go build ./src/api` alone
      # compiles fine but silently produces a library archive, not a binary,
      # with exit code 0. mk/go.mk resolves this (see its own comment); this
      # step exists so a future regression to mk/go.mk is caught in CI, not
      # discovered first at deploy time.
      #
      # M-023: `messaging` used to be built here too, as a non-regression
      # check for the legacy "main.go at package root" layout mk/go.mk had to
      # keep supporting. M-023 deleted the 8 pre-migration Go services, so
      # that layout no longer exists anywhere in the repo and the entry was
      # removed — leaving it would fail the build on a deleted directory.
      # mk/go.mk's `gobuildpath` conditional still handles both layouts and
      # is deliberately NOT simplified: src/bastion (type=docker) and any
      # future single-package Go tool would use the flat layout.
      - name: Build production binaries (real entrypoints, mk/go.mk D-M09)
        run: |
          set -euo pipefail
          for pkg in api core-processor intelligence-processor; do
            make build pkg=$pkg
            # `file` confirms an actual executable was produced, not an `ar
            # archive` (the exact silent failure mode of D-M09).
            file ./bin/$pkg | tee /dev/stderr | grep -qiE 'executable|ELF' \
              || { echo "ERROR: ./bin/$pkg is not an executable (D-M09 regression?)"; exit 1; }
          done

      # D-M20: no depguard/.golangci.yml exists in this repository, so the
      # "0 cross-service import" boundary rules asserted by CLAUDE.md /
      # ARCHITECTURE.md §7 are otherwise checked only by manual architecture
      # review. golangci-lint + depguard would be the preferred tool, but
      # installing/configuring golangci-lint requires network access not
      # guaranteed in every environment this repo is built in, and it was not
      # possible to verify a working depguard config offline in this session
      # (golangci-lint is not installed here — see DevOps report). This step
      # is an explicit, verified SUBSTITUTE for depguard — not a full
      # replacement — using only `go list -deps` (part of the Go toolchain
      # already set up above) + grep. It enforces the one boundary explicitly
      # called out by .ia/MIGRATION_PLAN.md (D-M20): neither worker may
      # depend on the unified HTTP service (workers must be deployable/
      # scalable independently of it, see deploy/k8s/services/).
      #
      # M-023: the 8 pre-migration Go services (messaging, routing, provider,
      # wallet, webhook, contact-intelligence, campaign, analytics) were
      # dropped from this pattern along with the directories themselves —
      # `go list -deps` can never emit a package that does not exist, so
      # keeping them would have been dead weight suggesting a boundary that
      # is now enforced by their absence. `api` remains the one live rule.
      - name: Verify worker import boundaries (D-M20, depguard substitute)
        run: |
          set -euo pipefail
          forbidden_pattern='^fleece/src/api(/|$)'
          fail=0
          for pkg in core-processor intelligence-processor; do
            echo "checking fleece/src/${pkg}/... dependencies..."
            deps=$(go list -deps ./src/${pkg}/...)
            if echo "$deps" | grep -E "$forbidden_pattern"; then
              echo "ERROR: fleece/src/${pkg} depends on a forbidden package (see above)."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more workers import a forbidden package — see .ia/MIGRATION_PLAN.md D-M20."
            exit 1
          fi
          echo "OK: no forbidden cross-service imports in core-processor / intelligence-processor."

  # -----------------------------------------------------------------------
  # TypeScript: type-check + esbuild bundle (auth-api, graphql-api, rest-api)
  # -----------------------------------------------------------------------
  ts:
    name: TypeScript build (auth-api + graphql-api + rest-api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: "npm"

      - name: Install dependencies
        # package-lock.json is present at repo root (npm workspaces)
        run: npm ci

      - name: Install make
        run: sudo apt-get install -y make

      - name: Build auth-api
        run: make build pkg=auth-api

      - name: Build graphql-api
        run: make build pkg=graphql-api

      - name: Build rest-api
        run: make build pkg=rest-api

  # -----------------------------------------------------------------------
  # Frontend: platform-app (Next.js)
  # -----------------------------------------------------------------------
  frontend:
    name: Frontend build (platform-app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install make
        run: sudo apt-get install -y make

      - name: Build platform-app
        run: make build pkg=platform-app

  # -----------------------------------------------------------------------
  # Migrations: Atlas checksum + validate
  # -----------------------------------------------------------------------
  migrations:
    name: Atlas migrate validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Atlas
        run: |
          curl -sSf https://atlasgo.sh | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify migration checksum (atlas migrate hash)
        # Ensures atlas.sum is up-to-date with the migrations/ directory.
        # If atlas.sum is missing or stale, this regenerates it; the diff
        # check below catches any uncommitted drift.
        run: atlas migrate hash --dir file://migrations

      - name: Check for uncommitted atlas.sum changes
        # Fails the CI if the developer forgot to commit an updated atlas.sum
        # after adding or editing a migration file.
        run: |
          if ! git diff --exit-code migrations/; then
            echo "ERROR: atlas.sum is out of date. Run 'atlas migrate hash --dir file://migrations' and commit the result."
            exit 1
          fi

      - name: Validate migrations (lint)
        # atlas migrate lint requires a running dev database (docker://postgres/16/dev).
        # In CI without Docker-in-Docker this step is best-effort; remove --dev-url flag
        # if the runner does not support Docker socket.
        # The validate subcommand checks syntax and ordering without a live DB.
        run: atlas migrate validate --dir file://migrations
        continue-on-error: true
