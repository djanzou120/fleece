# Atlas migration init job.
#
# PREREQUISITE — create ConfigMaps from the repo files before applying this job.
# Use the Makefile target (idempotent, re-run after adding new migration files):
#
#   make k8s-configmaps
#
# This creates both atlas-migrations (from migrations/) and atlas-hcl (from
# atlas.hcl) in the fleece namespace using --dry-run=client | kubectl apply,
# so it is safe to run multiple times.
#
# The job reads DATABASE_URL from the fleece-secret Secret (postgres:// URL format).
# It mounts migrations/ under /migrations and atlas.hcl under /atlas/atlas.hcl.
#
# Apply order:
#   1. namespace.yaml
#   2. config/secret.yaml  (from secret.example.yaml)
#   3. infra/postgres.yaml  (wait for postgres readiness)
#   4. make k8s-configmaps  (creates atlas-migrations + atlas-hcl ConfigMaps)
#   5. jobs/atlas-migrate.yaml  (wait for job completion before services)
#   6. services/*.yaml
#
apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-migrate
  namespace: fleece
  labels:
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: atlas-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres:5432..."
              until nc -z postgres 5432; do
                echo "postgres not ready, retrying in 3s"
                sleep 3
              done
              echo "postgres is ready."
      containers:
        - name: atlas
          image: fleece/bastion:latest
          imagePullPolicy: IfNotPresent
          command:
            - atlas
            - migrate
            - apply
            - --dir
            - "file:///migrations"
            - --url
            - "$(DATABASE_URL)"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fleece-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: atlas-hcl
              mountPath: /atlas
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: atlas-migrations
        - name: atlas-hcl
          configMap:
            name: atlas-hcl
