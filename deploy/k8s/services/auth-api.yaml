# auth-api — Identity Service (TypeScript + Better Auth)
# Built from docker/node.dockerfile ARG PKG=auth-api
# No ENTRYPOINT in node.dockerfile dist stage → explicit command required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: fleece
  labels:
    app: auth-api
    app.kubernetes.io/component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."; sleep 3
              done
      containers:
        - name: auth-api
          image: fleece/auth-api:latest
          imagePullPolicy: IfNotPresent
          # node.dockerfile dist stage copies bundle to /usr/local/bin/$PKG without ENTRYPOINT
          command: ["node", "/usr/local/bin/auth-api"]
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fleece-secret
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: fleece-config
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  # DNS name: auth-api (used by graphql-api via AUTH_API_URL=http://auth-api:3001)
  name: auth-api
  namespace: fleece
  labels:
    app: auth-api
spec:
  type: ClusterIP
  selector:
    app: auth-api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-api-hpa
  namespace: fleece
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
