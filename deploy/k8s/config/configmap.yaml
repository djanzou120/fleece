apiVersion: v1
kind: ConfigMap
metadata:
  name: fleece-config
  namespace: fleece
data:
  # --- PostgreSQL (shared, non-sensitive) ---
  POSTGRES_DRIVER: "postgres"

  # --- RabbitMQ ---
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"

  # --- Routing service specific ---
  DEFAULT_CURRENCY: "XAF"

  # --- Inter-service URLs (DNS names = Kubernetes Service names) ---
  ROUTING_URL: "http://routing:8083"
  WALLET_URL: "http://wallet:8082"
  PROVIDER_URL: "http://provider:8084"
  MESSAGING_API_URL: "http://messaging:8081"
  WEBHOOK_API_URL: "http://webhook:8085"
  AUTH_API_URL: "http://auth-api:3001"
  WALLET_API_URL: "http://wallet:8082"

  # --- Go services: PORT overrides (each service gets its own value via envFrom + env override) ---
  # These are declared per-Deployment; kept here for documentation purposes.
  # messaging: PORT=8081, wallet: PORT=8082, routing: PORT=8083,
  # provider: PORT=8084, webhook: PORT=8085

  # --- Go services: POSTGRES_SEARCH_PATH per service ---
  # Set individually in each Deployment via env[]; kept here for reference.
  # messaging=messaging, wallet=wallet, routing=routing, provider=provider, webhook=webhook

  # --- TypeScript services ---
  # auth-api
  AUTH_PORT: "3001"
  # graphql-api
  GRAPHQL_PORT: "4000"

  # --- Frontend (Next.js) ---
  # NOTE: NEXT_PUBLIC_GRAPHQL_URL is a browser-side URL.
  # For MVP, the graphql-api LoadBalancer external IP/hostname must replace this value.
  # During cluster-internal access (SSR), use http://graphql-api:4000/graphql.
  NEXT_PUBLIC_GRAPHQL_URL: "http://graphql-api:4000/graphql"
