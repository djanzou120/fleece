# TEMPLATE ONLY — DO NOT COMMIT WITH REAL VALUES.
# Copy this file to secret.yaml, fill in real values, and apply with:
#   kubectl apply -f deploy/k8s/config/secret.yaml -n fleece
# secret.yaml is .gitignored; only this template is committed.
#
# Two representations of the DB connection are required:
#   - POSTGRES_DSN  : libpq key=value format  → used by Go services
#   - DATABASE_URL  : postgres:// URL format   → used by auth-api (TS) and Atlas init job
#
apiVersion: v1
kind: Secret
metadata:
  name: fleece-secret
  namespace: fleece
type: Opaque
stringData:
  # --- Database (Go services) ---
  POSTGRES_DSN: "host=postgres port=5432 user=fleece password=CHANGE_ME dbname=fleece sslmode=disable"

  # --- Database (auth-api TS + Atlas init job) ---
  DATABASE_URL: "postgres://fleece:CHANGE_ME@postgres:5432/fleece"

  # --- Twilio (provider service) ---
  TWILIO_ACCOUNT_SID: "CHANGE_ME"
  TWILIO_AUTH_TOKEN: "CHANGE_ME"
  TWILIO_BASE_URL: "https://api.twilio.com"
  TWILIO_FROM_NUMBER: "CHANGE_ME"

  # --- WhatsApp Meta (provider service) ---
  WHATSAPP_META_BASE_URL: "https://graph.facebook.com/v18.0"
  WHATSAPP_META_PHONE_NUMBER_ID: "CHANGE_ME"
  WHATSAPP_META_TOKEN: "CHANGE_ME"

  # --- Telegram (src/api/providers/telegram.go) ---
  # D-M05: the bot token grants full control of the bot (send messages as
  # it, read updates) — it MUST be a Secret, never a ConfigMap value.
  # TELEGRAM_BASE_URL (non-sensitive) lives in config/configmap.yaml.
  TELEGRAM_BOT_TOKEN: "CHANGE_ME"

  # --- Payment webhook HMAC secrets (src/api/webhooks_om.go, webhooks_mtn.go) ---
  # D-M05: these authenticate inbound Orange Money / MTN MoMo callbacks
  # (HMAC-SHA256, constant-time compare). Empty = signature verification
  # disabled with a WARN log (see main.go) — acceptable in dev/test only,
  # never in production. Each operator gets its own secret; a shared value
  # would let either operator forge callbacks for the other.
  OM_WEBHOOK_SECRET: "CHANGE_ME"
  MTN_WEBHOOK_SECRET: "CHANGE_ME"
